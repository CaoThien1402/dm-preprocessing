# Build Jupyter Book từ các notebook (đã chạy sẵn kết quả ở máy local) và deploy lên GitHub Pages.
# Bật trước: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Trang dạng <username>.github.io/<repo> cần BASE_URL = /<repo>.
  # Nếu repo tên là <username>.github.io thì xóa dòng này.
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v6

      # Chỉ cài nhóm "book" (jupyter-book), không cài torch/sklearn... vì CI không chạy lại notebook.
      - name: Install Jupyter Book
        run: uv sync --only-group book

      - name: Build HTML
        working-directory: book
        run: uv run --no-sync jupyter-book build --html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

      - id: deployment
        uses: actions/deploy-pages@v4
